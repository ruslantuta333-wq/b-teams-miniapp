<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B Teams Shop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{
    margin:0;
    padding:18px;
    background:#0b0d10;
    color:#fff;
    font-family:Arial,sans-serif;
}
h1{
    text-align:center;
    margin:8px 0 5px;
}
.subtitle{
    text-align:center;
    color:#8f969f;
    margin-bottom:22px;
}
.card{
    background:#15181d;
    border-radius:18px;
    padding:18px;
    margin-bottom:15px;
}
.title{
    font-size:23px;
    font-weight:bold;
    margin-bottom:16px;
}
.plan{
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    padding:15px;
    margin:9px 0;
    border:0;
    border-radius:13px;
    background:#20252c;
    color:#fff;
    text-align:left;
    cursor:pointer;
}
.plan:active{
    transform:scale(.98);
}
.days{
    font-weight:bold;
    font-size:16px;
}
.price{
    color:#bfc5cc;
    font-size:14px;
}
</style>
</head>

<body>

<h1>🛒 B Teams Shop</h1>
<div class="subtitle">Выбери срок ZOLO</div>

<div class="card">
<div class="title">💎 ZOLO</div>

<button class="plan" onclick="selectPlan(1,170,85)">
    <span class="days">💎 1 Day</span>
    <span class="price">170 ₽ / 85 ₴</span>
</button>

<button class="plan" onclick="selectPlan(3,400,180)">
    <span class="days">💎 3 Days</span>
    <span class="price">400 ₽ / 180 ₴</span>
</button>

<button class="plan" onclick="selectPlan(7,800,325)">
    <span class="days">💎 7 Days</span>
    <span class="price">800 ₽ / 325 ₴</span>
</button>

<button class="plan" onclick="selectPlan(14,1000,450)">
    <span class="days">💎 14 Days</span>
    <span class="price">1000 ₽ / 450 ₴</span>
</button>

<button class="plan" onclick="selectPlan(30,1500,690)">
    <span class="days">💎 30 Days</span>
    <span class="price">1500 ₽ / 690 ₴</span>
</button>

<button class="plan" onclick="selectPlan(60,2000,1000)">
    <span class="days">💎 60 Days</span>
    <span class="price">2000 ₽ / 1000 ₴</span>
</button>

</div>

<script>
const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

function selectPlan(days, rub, uah) {
    tg.showPopup({
        title: "💎 ZOLO",
        message:
            "Срок: " + days + " дней\n\n" +
            "🇷🇺 " + rub + " RUB\n" +
            "🇺🇦 " + uah + " UAH",
        buttons: [
            {
                id: "rub",
                type: "default",
                text: "🇷🇺 RUB"
            },
            {
                id: "uah",
                type: "default",
                text: "🇺🇦 UAH"
            },
            {
                type: "cancel"
            }
        ]
    }, function(buttonId) {

        if (buttonId === "rub") {
            tg.sendData(JSON.stringify({
                product: "ZOLO",
                days: days,
                currency: "RUB",
                price: rub
            }));
        }

        if (buttonId === "uah") {
            tg.sendData(JSON.stringify({
                product: "ZOLO",
                days: days,
                currency: "UAH",
                price: uah
            }));
        }
    });
}
</script>

</body>
</html>
