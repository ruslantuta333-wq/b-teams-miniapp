<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>B Teams Shop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    padding:16px;
    background:#0e0e0e;
    color:#fff;
    font-family:Arial,sans-serif;
}

.container{
    max-width:520px;
    margin:auto;
}

.header{
    text-align:center;
    padding:10px 0 20px;
}

.header h1{
    margin:0;
    font-size:25px;
}

.header p{
    margin:7px 0 0;
    color:#999;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.section{
    display:none;
}

.section.active{
    display:block;
}

.card{
    background:#181818;
    border-radius:16px;
    padding:16px;
    margin-bottom:14px;
}

.product-title{
    font-size:22px;
    font-weight:bold;
    margin-bottom:5px;
}

.product-subtitle{
    color:#999;
    margin-bottom:16px;
}

.btn{
    width:100%;
    border:0;
    border-radius:13px;
    padding:14px;
    margin:6px 0;
    background:#f2c300;
    color:#111;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

.btn:active{
    transform:scale(.98);
}

.plan{
    display:flex;
    align-items:center;
    justify-content:space-between;
    text-align:left;
}

.plan-left{
    font-size:16px;
}

.plan-right{
    font-size:14px;
    font-weight:700;
}

.back{
    margin-top:12px;
}

.payment-info{
    text-align:center;
    font-size:17px;
    line-height:1.6;
    margin-bottom:12px;
}

.price{
    font-size:20px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
    <h1>🛒 B Teams Shop</h1>
    <p>Магазин софтов</p>
</div>

<!-- ГЛАВНОЕ МЕНЮ -->
<div id="home" class="section active">
    <div class="card">
        <div class="product-title">🏠 Главное меню</div>
        <div class="product-subtitle">Выбери нужный раздел</div>

        <div class="menu">
            <button class="btn" onclick="openSection('catalog')">
                🛒 Каталог софтов
            </button>

            <button class="btn" onclick="openSection('purchases')">
                🛍 Мои покупки
            </button>
        </div>
    </div>
</div>

<!-- КАТАЛОГ -->
<div id="catalog" class="section">
    <div class="card">
        <div class="product-title">🛒 Каталог софтов</div>
        <div class="product-subtitle">Выбери софт</div>

        <button class="btn" onclick="openSection('zolo')">
            💎 ZOLO
        </button>

        <button class="btn back" onclick="openSection('home')">
            ⬅️ Назад
        </button>
    </div>
</div>

<!-- ZOLO -->
<div id="zolo" class="section">
    <div class="card">
        <div class="product-title">💎 ZOLO</div>
        <div class="product-subtitle">Выбери срок подписки</div>

        <button class="btn plan" onclick="selectPlan(1,170,85)">
            <span class="plan-left">💎 1 Day</span>
            <span class="plan-right">170₽ / 85₴</span>
        </button>

        <button class="btn plan" onclick="selectPlan(3,400,180)">
            <span class="plan-left">💎 3 Days</span>
            <span class="plan-right">400₽ / 180₴</span>
        </button>

        <button class="btn plan" onclick="selectPlan(7,800,325)">
            <span class="plan-left">💎 7 Days</span>
            <span class="plan-right">800₽ / 325₴</span>
        </button>

        <button class="btn plan" onclick="selectPlan(14,1000,450)">
            <span class="plan-left">💎 14 Days</span>
            <span class="plan-right">1000₽ / 450₴</span>
        </button>

        <button class="btn plan" onclick="selectPlan(30,1500,690)">
            <span class="plan-left">💎 30 Days</span>
            <span class="plan-right">1500₽ / 690₴</span>
        </button>

        <button class="btn plan" onclick="selectPlan(60,2000,1000)">
            <span class="plan-left">💎 60 Days</span>
            <span class="plan-right">2000₽ / 1000₴</span>
        </button>

        <button class="btn back" onclick="openSection('catalog')">
            ⬅️ Назад
        </button>
    </div>
</div>

<!-- ВЫБОР ОПЛАТЫ -->
<div id="payment" class="section">
    <div class="card">
        <div class="product-title">💳 Оплата</div>

        <div id="paymentInfo" class="payment-info"></div>

        <button class="btn" onclick="chooseCurrency('RUB')">
            🇷🇺 Оплата RUB
        </button>

        <button class="btn" onclick="chooseCurrency('UAH')">
            🇺🇦 Оплата UAH
        </button>

        <button class="btn back" onclick="openSection('zolo')">
            ⬅️ Назад
        </button>
    </div>
</div>

<!-- ПОДТВЕРЖДЕНИЕ -->
<div id="confirm" class="section">
    <div class="card">
        <div class="product-title">✅ Подтверждение</div>

        <div id="confirmInfo" class="payment-info"></div>

        <button class="btn" onclick="sendOrder()">
            💳 Продолжить оплату
        </button>

        <button class="btn back" onclick="openSection('payment')">
            ⬅️ Назад
        </button>
    </div>
</div>

<!-- ПОКУПКИ -->
<div id="purchases" class="section">
    <div class="card">
        <div class="product-title">🛍 Мои покупки</div>
        <div class="product-subtitle">
            Здесь будут отображаться приобретённые товары.
        </div>

        <button class="btn back" onclick="openSection('home')">
            ⬅️ Назад
        </button>
    </div>
</div>

</div>

<script>
const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

let selectedPlan = null;
let selectedCurrency = null;

function openSection(id){
    document.querySelectorAll(".section").forEach(el=>{
        el.classList.remove("active");
    });

    document.getElementById(id).classList.add("active");

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

function selectPlan(days,rub,uah){
    selectedPlan={
        product:"ZOLO",
        days:days,
        rub:rub,
        uah:uah
    };

    document.getElementById("paymentInfo").innerHTML =
        "💎 ZOLO<br>" +
        "⏱ " + days + " дней<br><br>" +
        "<span class='price'>" +
        rub + "₽ / " + uah + "₴" +
        "</span>";

    openSection("payment");
}

function chooseCurrency(currency){
    selectedCurrency=currency;

    const price =
        currency==="RUB"
        ? selectedPlan.rub
        : selectedPlan.uah;

    document.getElementById("confirmInfo").innerHTML =
        "💎 ZOLO<br>" +
        "⏱ " + selectedPlan.days + " дней<br>" +
        "💰 <span class='price'>" +
        price + " " + currency +
        "</span>";

    openSection("confirm");
}

function sendOrder(){
    if(!selectedPlan || !selectedCurrency){
        tg.showAlert("Сначала выбери тариф и валюту.");
        return;
    }

    const price =
        selectedCurrency==="RUB"
        ? selectedPlan.rub
        : selectedPlan.uah;

    tg.sendData(JSON.stringify({
        product:selectedPlan.product,
        days:selectedPlan.days,
        currency:selectedCurrency,
        price:price
    }));
}
</script>

</body>
</html>
